name: ci

# Everything installs from requirements.txt — the same file Streamlit Cloud
# uses. One dependency list means CI, the scanner and the dashboard can't
# drift apart, and there's no second file for the deploy to pick instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes scanner/ main.py tests dashboard
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  dashboard-boot:
    # Builds a venv from requirements.txt alone and actually boots the app,
    # hitting every page. Catches both missing dependencies and anything that
    # only breaks at import time in the hosted environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: requirements.txt covers every dashboard import
        run: ./scripts/check_dashboard_deps.sh
      - name: dashboard boots and serves every page
        run: ./scripts/boot_check.sh
