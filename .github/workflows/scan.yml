name: scan

# The scanner's only trigger. Each run does two things:
#   1. drains pending Telegram commands via getUpdates
#   2. scans every enabled chat's sources and sends new matches
#
# Because commands are only read here, a bot reply can take up to one
# interval (15 min). That's the schedule, not slow code — the /help text
# says so explicitly. Use "Run workflow" for an immediate run.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay by 5-15 min in peak hours
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false   # never cancel a run mid-flight

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        # TURSO_* point the store at hosted libSQL, so there is no state to
        # commit back after the run. Drop them to fall back to a local
        # SQLite file instead.
        #
        # TG_CHAT_ID is optional: chats self-register when the bot is added
        # to them. It only acts as a fallback when no chat is registered yet.
        env:
          TG_BOT_TOKEN:     ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL:    ${{ vars.DASHBOARD_URL }}
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python main.py --config config.example.yml
