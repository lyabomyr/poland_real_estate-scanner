name: scan

# The scanner's only trigger. Each run does two things:
#   1. drains pending Telegram commands via getUpdates
#   2. scans every enabled chat's sources and sends new matches
#
# Because commands are only read here, a reply waits for the next run.
#
# HOW OFTEN THIS ACTUALLY RUNS — not what the cron says.
# GitHub heavily throttles scheduled workflows on free runners and simply
# drops the rest. Measured over 24h on this repo: 14 runs, average gap
# 115 minutes, worst 226. The cron below asks for 96 runs a day and gets
# roughly 12. Nothing is lost when a run is skipped — the delivery backlog
# means the next one resumes — but a bot reply can genuinely take hours.
#
# The minutes are offset on purpose. GitHub's own guidance is to avoid the
# start of the hour, which is its busiest moment; "*/15" fires at :00 and
# competes with everything else on the platform.
#
# Use "Run workflow" (workflow_dispatch) when you want an answer now — a
# manual dispatch is not throttled.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # offset off :00 — see the note above
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false   # never cancel a run mid-flight

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        # TURSO_* point the store at hosted libSQL, so there is no state to
        # commit back after the run. Drop them to fall back to a local
        # SQLite file instead.
        #
        # TG_CHAT_ID is optional: chats self-register when the bot is added
        # to them. It only acts as a fallback when no chat is registered yet.
        env:
          TG_BOT_TOKEN:     ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL:    ${{ vars.DASHBOARD_URL }}
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python main.py --config config.yml
