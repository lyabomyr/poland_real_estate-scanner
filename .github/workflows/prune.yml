name: prune

# Runs once a month on the 1st at 03:00 UTC. Purely opportunistic — the
# scanner works fine without it, this just keeps `seen` from bloating with
# stale rejected rows (basement flats, TBS, over-budget listings) after
# several months of scans. Matched / duplicate rows are never touched.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write             # for committing the archive CSVs back

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prune
        env:
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python main.py --config config.example.yml --prune

      - name: Commit archive CSVs
        run: |
          if git diff --quiet datasets/ 2>/dev/null && [ -z "$(git ls-files --others --exclude-standard datasets/)" ]; then
            echo "no archive changes — nothing to commit"
            exit 0
          fi
          git config user.name  "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/
          git diff --cached --quiet && exit 0
          git commit -m "monthly prune: archive rejected rows [skip ci]"
          # Race-safe: another workflow may have landed a commit while we ran.
          # Rebase + retry a few times before giving up.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts" && exit 1
