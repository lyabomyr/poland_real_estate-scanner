name: prune

# Runs once a month on the 1st at 03:00 UTC. Purely opportunistic — the
# scanner works fine without it, this just keeps `seen` from bloating with
# stale rejected rows (basement flats, TBS, over-budget listings) after
# several months of scans. Matched / duplicate rows are never touched.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write             # for committing the archive CSVs back

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Render config from secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: |
          cp config.example.yml config.yml
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path("config.yml")
          text = p.read_text(encoding="utf-8")
          text = text.replace('bot_token: "REPLACE_WITH_BOT_TOKEN"',
                              f'bot_token: "{os.environ["TG_BOT_TOKEN"]}"')
          text = text.replace('chat_id: ""',
                              f'chat_id: "{os.environ["TG_CHAT_ID"]}"')
          p.write_text(text, encoding="utf-8")
          PY

      - name: Prune
        env:
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: poetry run python main.py --prune

      - name: Commit archive CSVs
        run: |
          git config user.name  "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/
          git diff --cached --quiet || git commit -m "monthly prune: archive rejected rows [skip ci]"
          git push
