[project]
name = "poland-real-estate-scanner"
version = "0.1.0"
description = "Scans Otodom, OLX, and listaprzetargow.pl for Kraków apartments and alerts to Telegram."
authors = [
    { name = "Lubomyr Kachko", email = "lubomyr.kachko@stechinno.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "requests (>=2.31,<3.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "PyYAML (>=6.0,<7.0)",
    "libsql-experimental (>=0.0.55,<0.0.56)",
    "streamlit (>=1.61.0,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pyflakes = "^3.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
